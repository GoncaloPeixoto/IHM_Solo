<ion-content [fullscreen]="true">
  <img
    src="/assets/imgs/VF_Splash.png"
    alt="Splash Screen"
    class="splash-screen"
  />
  <div
    class="flex flex-column justify-content-space-between align-items-center position-absolute"
    style="
      height: 100%;
      width: 100%;
      background-color: var(--ion-color-dark);
      opacity: 0.8;
    "
  >
    <div class="flex justify-content-end w-100">
      <ion-button
        fill="clear"
        routerLink="/app/home"
        routerDirection="forward"
        color="purple"
      >
        <ion-icon name="arrow-forward-outline"></ion-icon>
      </ion-button>
    </div>
    <div class="flex">
      <img src="/assets/imgs/logo.svg" alt="" style="max-width: 300px" />
    </div>
    <div></div>
  </div>
</ion-content>
